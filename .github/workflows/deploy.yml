name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "test/**"
      - "scripts/**"
      - "*.md"
      - ".github/workflows/browser-qa.yml"
      - ".github/workflows/authenticated-production-e2e.yml"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

concurrency:
  group: outperform-production-operations
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Check deployment credentials
        shell: bash
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "$OPENROUTER_API_KEY" ] || missing+=("OPENROUTER_API_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions secrets: %s\\n' "${missing[*]}"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run domain tests
        run: npm test

      - name: Validate Worker source
        run: npm run check

      - name: Build production application
        run: npm run build

      - name: Verify production D1 point-in-time recovery without locking live traffic
        shell: bash
        run: |
          set -euo pipefail
          database_info="$(curl --silent --show-error --fail \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/90cefa028781f749f5816c5748f04cd2/d1/database/cb25ae38-f5bc-4e96-8ea2-b049456b5187")"
          printf '%s' "$database_info" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(input);
              if (payload.success !== true || payload.result?.version !== "production") {
                console.error("Production D1 Time Travel backend is not available.");
                process.exit(1);
              }
              console.log("Production D1 backend verified:", payload.result.version);
            });
          '
          bookmark_info="$(npx wrangler d1 time-travel info outperform-prod --config dist/worker/wrangler.json)"
          printf '%s\\n' "$bookmark_info"
          if ! grep -Eqi 'current bookmark' <<<"$bookmark_info"; then
            echo "Could not verify the current D1 recovery bookmark."
            exit 1
          fi
          echo "D1 automatic point-in-time recovery is available. This check is read-only and does not export or lock the live database."

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply outperform-prod --remote --config dist/worker/wrangler.json

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 90cefa028781f749f5816c5748f04cd2
          command: deploy --config dist/worker/wrangler.json

      - name: Create Better Auth secret once
        shell: bash
        run: |
          existing="$(npx wrangler secret list --config dist/worker/wrangler.json)"
          if ! printf '%s' "$existing" | grep -q 'BETTER_AUTH_SECRET'; then
            secret="$(openssl rand -base64 48 | tr -d '\\n')"
            printf '%s' "$secret" | npx wrangler secret put BETTER_AUTH_SECRET --config dist/worker/wrangler.json
          fi

      - name: Configure OpenRouter key
        run: printf '%s' "$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY --config dist/worker/wrangler.json

      - name: Verify production health
        shell: bash
        run: |
          url="https://outperform.buttercoder-dev.workers.dev/api/health"
          for attempt in $(seq 1 30); do
            body="$(curl --silent --show-error --fail "$url" || true)"
            if [ -n "$body" ] && printf '%s' "$body" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                try {
                  const health = JSON.parse(input);
                  const ready = health.ok === true &&
                    health.database === true &&
                    health.dailyUsageConfigured === true &&
                    health.userPlaybooksConfigured === true &&
                    health.artifactStorage === true &&
                    health.durableWorkflow === true &&
                    health.authenticationConfigured === true &&
                    health.modelProviderConfigured === true;
                  if (!ready) process.exit(1);
                } catch { process.exit(1); }
              });
            '; then
              echo "OUTPERFORM production health checks passed."
              exit 0
            fi
            sleep 10
          done
          echo "OUTPERFORM did not reach a fully configured healthy state."
          exit 1

      - name: Smoke test guest entry and authenticated API boundaries
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = "https://outperform.buttercoder-dev.workers.dev";
          const htmlResponse = await fetch(base + "/");
          if (!htmlResponse.ok) throw new Error("Guest entry returned HTTP " + htmlResponse.status);
          const html = await htmlResponse.text();
          if (!html.includes('id="root"')) throw new Error("Guest entry HTML has no React root.");
          const scripts = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map((match) => match[1]);
          if (!scripts.length) throw new Error("No application script was found in the guest entry HTML.");
          const bundleResponse = await fetch(new URL(scripts[0], base));
          if (!bundleResponse.ok) throw new Error("Guest application bundle returned HTTP " + bundleResponse.status);
          const bundle = await bundleResponse.text();
          for (const marker of ["No account required", "outperform_guest_work", "Continue without an account", "Brief completeness", "Export AI prompt", "Make the next pass better", "Run another improvement pass"]) {
            if (!bundle.includes(marker)) throw new Error("Guest experience marker missing from production bundle: " + marker);
          }
          for (const path of ["/api/sessions", "/api/usage", "/api/playbooks", "/api/account"]) {
            const response = await fetch(base + path, { method: path === "/api/account" ? "DELETE" : "GET" });
            if (response.status !== 401) throw new Error(path + " must require authentication; got HTTP " + response.status);
          }
          console.log("Guest entry is public, guest workspace is in the production bundle, and private APIs reject anonymous access.");
          NODE
