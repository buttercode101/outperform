name: Production browser QA

on:
  workflow_run:
    workflows: ["Deploy production"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  guest-browser:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test live production guest experience
        run: node scripts/outperform-production-browser-qa.mjs
        env:
          OUTPERFORM_URL: https://outperform.buttercoder-dev.workers.dev
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outperform-production-browser-qa
          path: artifacts/browser-qa/
          if-no-files-found: warn
          retention-days: 7
